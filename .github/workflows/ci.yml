name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  # Pinned to match local dev setup: SDK 2.2.0 Release (commit a1438df)
  PICO_SDK_TAG: "2.2.0"

permissions:
  contents: read
  pull-requests: write   # needed so the coverage report can comment on PRs

jobs:
  build-firmware:
    name: Build firmware (RP2040 / Pico SDK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pico-sdk
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: ${{ env.PICO_SDK_TAG }}
          submodules: recursive
          path: pico-sdk

      - name: Install ARM toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            python3

      - name: Configure
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          mkdir -p build
          cmake -DCMAKE_BUILD_TYPE=debug -B build -S .

      - name: Build
        run: cmake --build build --parallel

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build
          path: |
            build/**/*.elf
            build/**/*.uf2
            build/**/*.bin
            build/**/*.hex
          if-no-files-found: ignore

  unit-tests:
    name: Unit tests (CppUTest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            autoconf automake libtool lcov

      - name: Build and run unit tests
        working-directory: tests
        run: make all

      - name: Capture coverage
        working-directory: tests
        run: |
          lcov --capture --directory test-obj --base-directory . --output-file coverage.info --ignore-errors mismatch
          lcov --remove coverage.info '/usr/*' '*/cpputest/*' --output-file coverage.info

      - name: Generate HTML report
        working-directory: tests
        run: genhtml coverage.info --output-directory coverage-report

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tests/coverage-report/

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: zgosalvez/github-actions-report-lcov@v4
        with:
          coverage-files: tests/coverage.info
          minimum-coverage: 0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: tests
