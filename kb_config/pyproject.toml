[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb_config"
version = "0.1.0"
description = "keyboard configuration tool"
license = { file = "LICENSE" }
authors = [
  { name = "Francis Stokes" }
]
requires-python = ">=3.9"
dependencies = [
  "pyusb==1.3.1",
]

[project.scripts]
kbconfig = "kb_config.cli:main"